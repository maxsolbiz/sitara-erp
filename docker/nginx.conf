events {}
http {
  upstream api {
    server api:3000;
  }
  upstream web {
    server web:3000;
  }

  server {
    listen 80;
    server_name sitara.pk *.sitara.pk;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name sitara.pk *.sitara.pk;

    ssl_certificate /etc/letsencrypt/live/sitara.pk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sitara.pk/privkey.pem;

    client_max_body_size 10M;

    location /api/v1/ {
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    location /_next/ {
      proxy_pass http://web;
      proxy_set_header Host $host;
    }

    location / {
      proxy_pass http://web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
