# Sitara ERP backend API — HTTP vhost (certbot --apache will generate the -le-ssl.conf twin).
# Matches the existing on-box style (cf. club.maxsolbiz.com.conf).
<VirtualHost *:80>
    ServerName api.sitarapurse.com
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3103/ flushpackets=on disablereuse=on
    ProxyPassReverse / http://127.0.0.1:3103/
    ErrorLog /var/log/apache2/sitara-api-error.log
    CustomLog /var/log/apache2/sitara-api-access.log combined
</VirtualHost>
