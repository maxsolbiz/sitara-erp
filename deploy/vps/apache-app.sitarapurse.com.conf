# Sitara ERP frontend — HTTP vhost (certbot --apache will generate the -le-ssl.conf twin).
# Matches the existing on-box style (cf. club.maxsolbiz.com.conf).
<VirtualHost *:80>
    ServerName app.sitarapurse.com
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3104/ flushpackets=on disablereuse=on
    ProxyPassReverse / http://127.0.0.1:3104/
    ErrorLog /var/log/apache2/sitara-app-error.log
    CustomLog /var/log/apache2/sitara-app-access.log combined
</VirtualHost>
